<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>예담 키오스크 홈 | ㈜예담정보통신</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/favicon_256.png">
<link rel="stylesheet" href="kiosk.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1115;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }

  /* 21.5인치 세로 화면(1080x1920) 기준 상단 2x2(정사각형) + 하단 1칸, 총 5분할 */
  .kiosk-page {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    gap: 8px;
    padding: 8px;
    box-sizing: border-box;
    background: #0f1115;
  }

  .kiosk-top {
    flex: 0 0 auto;
    display: flex;
    overflow: hidden;
  }

  /* 타일 한 변 크기 = 가로 폭 기준(2등분)으로 계산 → 세로로 긴 실제 키오스크
     화면(1080x1920)에서는 폭 전체를 꽉 채우는 정사각형이 되고, 그만큼 하단이 커짐.
     38vh는 가로로 넓은 화면에서 그리드가 화면 밖으로 넘쳐 하단이 사라지지 않도록 하는 안전장치 */
  .kiosk-square-grid {
    --tile-size: min(calc((100vw - 24px) / 2), 38vh);
    display: grid;
    grid-template-columns: repeat(2, var(--tile-size));
    grid-auto-rows: var(--tile-size);
    gap: 8px;
    width: 100%;
  }

  .kiosk-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
    min-height: 0;
    min-width: 0;
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .kiosk-tile:active {
    transform: scale(0.985);
  }

  .kiosk-tile-label {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.2px;
  }

  .kiosk-tile-1 .kiosk-tile-label { background: linear-gradient(90deg, #4f46e5, #6366f1); } /* AI PIA */
  .kiosk-tile-2 .kiosk-tile-label { background: linear-gradient(90deg, #0ea5e9, #38bdf8); } /* MOM */
  .kiosk-tile-3 .kiosk-tile-label { background: linear-gradient(90deg, #ea580c, #f97316); } /* 선생님도우미 */
  .kiosk-tile-4 .kiosk-tile-label { background: linear-gradient(90deg, #16a34a, #22c55e); } /* 두뇌 놀이터 */

  .kiosk-tile-imgwrap {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    background: #f1f5f9;
  }

  .kiosk-tile-imgwrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  .kiosk-bottom {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
    min-height: 0;
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .kiosk-bottom:active {
    transform: scale(0.99);
  }

  .kiosk-bottom-label {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #334155, #475569);
    letter-spacing: -0.2px;
  }

  .kiosk-bottom-imgwrap {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    background: #f1f5f9;
  }

  .kiosk-bottom-imgwrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  /* 이 홈 화면에서는 전체화면 버튼이 하단 배너와 겹치지 않도록 우측 상단으로 이동 */
  html.kiosk-on #kiosk-fs-btn {
    top: 12px;
    right: 12px;
    bottom: auto;
    padding: 10px 16px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="kiosk-page">
    <div class="kiosk-top">
      <div class="kiosk-square-grid">
        <a class="kiosk-tile kiosk-tile-1" href="aipia/test.html"
           onclick="try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);}catch(e){}">
          <div class="kiosk-tile-label">🧭 AI PIA · 성격·진로 검사</div>
          <div class="kiosk-tile-imgwrap">
            <img src="images/kiosk-aipia.svg" alt="AI PIA · 성격·진로 검사" loading="lazy">
            <span class="kiosk-tile-hint">탭하여 열기 →</span>
          </div>
        </a>
        <a class="kiosk-tile kiosk-tile-2" href="mom/test.html"
           onclick="try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);}catch(e){}">
          <div class="kiosk-tile-label">🧠 MOM · 인지건강 확인</div>
          <div class="kiosk-tile-imgwrap">
            <img src="images/kiosk-mom.svg" alt="MOM · 인지건강 확인" loading="lazy">
            <span class="kiosk-tile-hint">탭하여 열기 →</span>
          </div>
        </a>
        <a class="kiosk-tile kiosk-tile-3" href="teacher-hub.html"
           onclick="try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);}catch(e){}">
          <div class="kiosk-tile-label">🍎 선생님도우미</div>
          <div class="kiosk-tile-imgwrap">
            <img src="images/kiosk-teacher.svg" alt="선생님도우미" loading="lazy">
            <span class="kiosk-tile-hint">탭하여 열기 →</span>
          </div>
        </a>
        <a class="kiosk-tile kiosk-tile-4" href="mom-play.html"
           onclick="try{(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||function(){}).call(document.documentElement);}catch(e){}">
          <div class="kiosk-tile-label">🎮 두뇌 놀이터</div>
          <div class="kiosk-tile-imgwrap">
            <img src="images/kiosk-play.svg" alt="두뇌 놀이터" loading="lazy">
            <span class="kiosk-tile-hint">탭하여 열기 →</span>
          </div>
        </a>
      </div>
    </div>
    <a class="kiosk-bottom" href="https://aiedu.visang.com/" target="_blank" rel="noopener">
      <div class="kiosk-bottom-label">📢 AI 교육 · 안내 (새 창으로 열림)</div>
      <div class="kiosk-bottom-imgwrap">
        <img src="images/kiosk-aiedu.svg" alt="AI 교육 안내" loading="lazy">
      </div>
    </a>
  </div>

  <script src="kiosk.js"></script>
</body>
</html>

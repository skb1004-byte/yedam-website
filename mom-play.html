<html lang="ko">
<head>

<style>
:root{--ink:#141413;--ink2:#4a463f;--paper:#faf9f5;--paper2:#f1eee6;--line:#ddd8cb;
--rust:#d97757;--rust2:#c4623f;--ok:#5c7a4a;--okbg:#eef4e7;--warn:#b7791f;--warnbg:#fdf3e2;--red:#b3372c;--sky:#4f7dab}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
.app{max-width:760px;margin:0 auto;padding:0 18px 40px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#7ba05b,#5c7a4a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.top h1{font-size:1.25rem;font-weight:800}
.top .sub{font-size:.82rem;color:var(--ink2)}
.sp{flex:1}
.hbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:.95rem;font-weight:700;color:var(--ink2);cursor:pointer;text-decoration:none}
.scr{display:none}.scr.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:0 3px 14px rgba(20,20,19,.05);margin-bottom:16px}
.q-text{font-size:1.5rem;font-weight:800;line-height:1.5;word-break:keep-all}
.q-help{font-size:1.05rem;color:var(--ink2);margin-top:8px;word-break:keep-all}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:18px;font-size:1.3rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px;min-height:64px;word-break:keep-all}
.btn-main{background:var(--rust);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-line{background:#fff;color:var(--ink2);border:2px solid var(--line)}
.reco{background:linear-gradient(135deg,#fdf0ea,#fdf3e2);border:2px solid #eac3ae;border-radius:18px;padding:18px;margin-bottom:16px;word-break:keep-all}
.reco b{color:var(--rust2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px 12px;text-align:center;cursor:pointer;position:relative}
.tile:active{background:var(--paper2)}
.tile .ic{font-size:2.6rem}
.tile .t{font-size:1.15rem;font-weight:800;margin-top:6px}
.tile .d{font-size:.85rem;color:var(--ink2)}
.tile .badge{position:absolute;top:-10px;right:-6px;background:var(--rust);color:#fff;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 10px}
.lvl-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.lvl{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 4px;font-size:1rem;font-weight:800;color:var(--ink2);cursor:pointer;text-align:center}
.lvl.sel{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 10px;font-size:1.25rem;font-weight:800;cursor:pointer;font-family:inherit;min-height:62px;color:var(--ink);word-break:keep-all}
.choice.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.choice.bad{border-color:var(--red);background:#fbeceb;color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gridN{display:grid;gap:10px;margin-top:14px}
.mcard{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:var(--rust);display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:pointer;user-select:none;color:#fff;font-weight:900}
.mcard.open{background:#fff}
.mcard.done{background:var(--okbg);border-color:var(--ok)}
.ncell{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;color:var(--rust2);cursor:pointer;user-select:none}
.ncell.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.scoreline{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;font-weight:700;color:var(--ink2);margin-bottom:8px}
.stamp-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.stamp.got{border:2px solid var(--rust);background:#fdf0ea}
.big-feedback{text-align:center;font-size:2rem;font-weight:900;margin:10px 0;min-height:52px}
.footer-note{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:18px;word-break:keep-all}
@media(max-width:480px){html{font-size:15.5px}.mcard{font-size:1.9rem}}

/* ── 키오스크 가로 화면 대응 ───────────────────────────────────────────
   1024x768 같은 가로 키오스크에서 놀이 6개가 2열로만 깔려 아래 2개가
   화면 밖으로 밀려났다(측정: 624px 스크롤). 어르신이 스크롤을 안 하면
   "다른 그림 찾기 · 빨리 찾기"는 아예 없는 메뉴가 된다.
   가로 화면에서는 폭이 남으므로 3열로 펴서 한 화면에 담는다.
   .app 의 max-width:760px 도 같이 풀어야 3열이 실제로 넓어진다. */
@media (min-aspect-ratio:1/1) and (min-width:900px){
  .app{max-width:1180px;padding:0 14px 8px}
  /* 놀이 9개를 5열로 편다.
     3열이면 3행(507px)이 되어 그 아래 "지난 기록" 카드와 안내문이 화면
     밖으로 밀렸다(1024x768 에서 문서 942px / 화면 768px).
     5열이면 2행으로 줄어 전체가 한 화면에 들어온다. */
  .tiles{grid-template-columns:repeat(5,1fr);gap:9px}
  .tile{padding:11px 6px}
  .tile .ic{font-size:1.85rem}
  .tile .t{font-size:.98rem;margin-top:3px}
  .tile .d{font-size:.76rem}
  .top{padding:8px 0 6px}
  .top .logo{width:38px;height:38px;font-size:18px}
  .top h1{font-size:1.1rem}
  .card{padding:12px 16px;margin-bottom:9px}
  .stamp{width:32px;height:32px;font-size:1rem}
  .stamp-wrap{gap:6px}
  .scoreline{font-size:.95rem;margin-bottom:6px}
  /* 인사말 카드도 여백만 줄인다(문구는 그대로). */
  .reco{padding:9px 14px;margin-bottom:9px;font-size:.95rem}
  .footer-note{margin-top:6px;font-size:.8rem}

  /* ── 놀이 화면 격자 ────────────────────────────────────────────────
     15인치 키오스크 실물 사진에서 두 가지가 동시에 잘못돼 있었다.
       ① 칸이 너무 커서 아래가 잘렸다
          .mcard/.ncell 은 aspect-ratio:1 이라 칸 높이가 칸 폭을 따라간다.
          가로 화면에서 .app 폭이 1180px 까지 늘어나므로 3열이면 한 칸이
          370px 을 넘고, 두 줄이면 이미 화면 높이를 넘긴다.
          실제로 "편지 받는 사람" 6칸 중 아랫줄, "짝 맞추기" 셋째 줄이
          화면 밖으로 밀려 있었다.
       ② 반대로 칸 안의 그림은 작았다
          칸은 370px 인데 이모지는 2.2rem(약 37px)이라 허공만 넓었다.
          어르신이 튤립과 해바라기를 구분해야 하는 놀이인데 그림이 작다.

     그래서 폭을 따라가던 높이를 끊고, 격자 전체를 화면 높이에 맞춘 뒤
     줄 수에 상관없이 균등 분할한다(grid-auto-rows:1fr).
     줄이 2줄이든 4줄이든 항상 한 화면에 들어온다. */
  /* 격자 아래에는 정답 표시(.big-feedback)와 "그만하기" 버튼이 더 있다.
     실측: 격자 하단 684 → 표시 694~746 → 버튼 758~816 (문서 846 / 화면 768).
     격자만 화면에 맞추면 그 두 개가 밀려나므로 아래 자리까지 미리 뺀다. */
  .gridN{
    height: calc(100vh - 306px);
    min-height: 220px;
    grid-auto-rows: 1fr;
    gap: 8px;
    margin-top: 8px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  /* 편지 "어떤 말을 전할까요"는 아래에 되돌아가기 버튼이 하나 더 있다. */
  #ltTp{ height: calc(100vh - 382px); }
  /* 정답 표시와 아래 버튼도 가로 화면에서는 조금 줄여 격자에 높이를 준다. */
  .big-feedback{ font-size: 1.6rem; min-height: 34px; margin: 4px 0; }
  #p-game .btn{ padding: 12px; min-height: 52px; margin-top: 8px; font-size: 1.15rem; }
  .gridN > .mcard, .gridN > .ncell{
    aspect-ratio: auto;
    min-height: 0;
    padding: 4px;
    line-height: 1.2;
  }
  /* 칸이 제자리를 찾았으니 그림을 칸에 맞게 키운다.
     JS 가 칸마다 style.fontSize 를 직접 박아 넣기 때문에(예: 2.2rem)
     !important 가 없으면 이 규칙이 지고 그림이 그대로 작다. */
  .gridN > .mcard{ font-size: clamp(2.4rem, 10vh, 6rem) !important; }
  .gridN > .ncell{ font-size: clamp(2.2rem, 9vh, 5.5rem) !important; }
  /* 편지 고르기 칸만은 그림이 아니라 글자다(아들·며느리·"고맙습니다").
     이모지만큼 키우면 줄바꿈이 깨지므로 읽기 좋은 선에서 멈춘다. */
  #ltTo > .mcard{ font-size: clamp(1.6rem, 4.6vh, 2.6rem) !important; }
  #ltTp > .mcard{ font-size: clamp(1.25rem, 3.4vh, 2rem) !important; word-break: keep-all; }
  /* 문제 문구도 같이 키운다 — 그림만 커지면 글이 묻힌다. */
  /* 인라인 style 로 박힌 크기(예: 1.35rem)를 이겨야 실제로 커진다. */
  #gHost .q-text{ font-size: 1.45rem !important; margin-bottom: 2px; }
  #gHost .q-help{ font-size: 1.2rem !important; margin-top: 2px; }
  /* "빨리 찾기"는 문제 문장 안에 찾을 그림이 1.9rem 으로 들어가 그 줄만
     52px 로 부풀었다(다른 놀이는 31px). 격자 예산을 잡아먹으므로 줄인다. */
  #gHost .q-help span{ font-size: 1.5rem !important; vertical-align: middle; }

  /* 홈 화면 놀이 타일 — kiosk.css 의 공통 규칙이 !important 라 위의 압축이
     그대로 지고 있었다(타일 1개 127px → 156px).
     kiosk.css 가 이 파일보다 뒤에 실려 같은 !important 끼리는 그쪽이 이긴다.
     선택자를 한 단계 더 붙여 특이도로 넘는다. */
  html.kiosk-on body .tile{ padding: 11px 6px !important; }
  html.kiosk-on body .tile .ic{ font-size: 1.85rem !important; }
  html.kiosk-on body .tile .t{ font-size: .98rem !important; }
  html.kiosk-on body .tile .d{ font-size: .76rem !important; }

  /* 선택지 버튼도 kiosk.css 의 공통 button 규칙에 져서 21px → 18px 로
     오히려 작아져 있었다. 어르신용 화면이므로 되돌린다. */
  .choice{ font-size: 1.25rem !important; min-height: 58px !important; padding: 12px 10px !important; }

  /* ── 토정비결 결과 ────────────────────────────────────────────────
     이 화면은 .gridN 이 없어 위 규칙의 혜택을 못 받는다. 정적 계산으로
     약 896px(화면 768px) — "생년월일 다시 넣기" 버튼과 면책 문구가
     화면 밖으로 밀린다. 큰 이모지와 줄간격을 줄여 안으로 넣는다. */
  .saju-emoji{ font-size: 2rem !important; }
  .saju-head{ padding: 2px 0 !important; }
  .saju-gwa{ padding: 8px 14px !important; margin-bottom: 7px !important; }
  .saju-body{ font-size: 1rem !important; line-height: 1.42 !important; padding: 10px 14px !important; }
  #sajuOther{ margin-top: 7px !important; }
  /* 맨 아래 면책 문구까지 q-help 확대 규칙에 걸려 오히려 커져 있었다. */
  .saju-note{ font-size: .85rem !important; margin-top: 6px !important; }
  /* 정답 표시줄은 놀이 중에는 자리를 잡고 있어야 한다(글자가 나타났다 사라질
     때 아래 버튼이 들썩이면 안 되므로). 다만 토정비결은 정답이라는 게 없어
     이 줄이 끝까지 비어 있다 — 그 42px 때문에 면책 문구가 밀렸다. */
  #gHost:has(.saju-body) + .big-feedback{ min-height: 0; margin: 0; }
}
</style>

</head>

<div class="app">
<header class="top">
  <div class="logo">놀이</div>
  <div><h1>맘(MOM) · 두뇌 놀이터</h1><div class="sub">매일 조금씩, 즐겁게 두뇌 운동</div></div>

<!-- 홈 -->
<section class="scr on" id="p-home">
  <div class="reco" id="recoBox">오늘도 반갑습니다! 좋아하는 놀이를 골라 보세요.</div>

<!-- 게임 공통 화면 -->
<section class="scr" id="p-game">
  <div class="card">
    <div class="scoreline"><span id="gTitle">놀이</span><span id="gScore">0 / 5</span></div>
    <div id="gHost"></div>

    <button class="btn btn-line" onclick="goHome()">그만하고 나가기</button>

<!-- 라운드 끝 -->
<section class="scr" id="p-done">
  <div class="card" style="text-align:center">
    <div style="font-size:4rem" id="dEmoji">🎉</div>
    <div class="q-text" id="dMsg">참 잘하셨어요!</div>
    <div class="q-help" id="dScore"></div>
    <button class="btn btn-main" onclick="replay()">한 번 더 하기</button>
    <button class="btn btn-line" onclick="goHome()">다른 놀이 하기</button>
  </div>

</div>

<script>
"use strict";
var $=function(s){return document.querySelector(s);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 기기에서 가장 자연스러운 한국어 목소리 자동 선택 */
var _voice=null,_voiceNatural=false;
function _scoreVoice(v){
  if(!v||(v.lang||'').toLowerCase().indexOf('ko')!==0)return -1;
  var n=v.name||'';
  if(/SunHi|InJoon/i.test(n))return 100;
  if(/Yuna/i.test(n))return 95;
  if(/Natural|Neural/i.test(n))return 90;
  if(/Google/i.test(n))return 85;
  if(v.localService===false)return 75;
  return 50;
}
function _pickVoice(){
  try{
    var best=null,bs=-1;
    speechSynthesis.getVoices().forEach(function(v){var s=_scoreVoice(v);if(s>bs){bs=s;best=v;}});
    _voice=best;_voiceNatural=bs>=75;
  }catch(e){}
}
try{_pickVoice();speechSynthesis.onvoiceschanged=_pickVoice;}catch(e){}
function say(t){
  try{
    speechSynthesis.cancel();
    if(!_voice)_pickVoice();
    var parts=String(t).replace(/([.!?…])\s*/g,"$1||CUT||").split("||CUT||").filter(function(s){return s.trim();});
    if(!parts.length)parts=[String(t)];
    parts.forEach(function(p){
      var u=new SpeechSynthesisUtterance(p.trim());
      u.lang='ko-KR';u.pitch=1;
      u.rate=_voiceNatural?0.85:0.7;
      if(_voice)u.voice=_voice;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

function stamps(){ try{return parseInt(localStorage.getItem('mom_stamps')||'0',10)||0;}catch(e){return 0;} }

function drawStamps(){
  var n=stamps(), box=$('#stampBox'); box.innerHTML='';
  var show=Math.max(10,Math.ceil(n/10)*10);
  for(var i=0;i<10;i++){
    var d=document.createElement('div');

    d.className='stamp'+((i<idx)?' got':'');

function feed(ok){

  f.textContent=ok?'⭕ '+PRAISE[Math.floor(Math.random()*PRAISE.length)]:'❌ '+CHEER[Math.floor(Math.random()*CHEER.length)];

/* ---------- 게임별 최고 기록 & 난이도 자동 승급 ---------- */
function bestGet(){ try{ return JSON.parse(localStorage.getItem('mom_best')||'{}'); }catch(e){ return {}; } }
function bestSet(o){ try{ localStorage.setItem('mom_best',JSON.stringify(o)); }catch(e){} }
function recordBest(g,lv,sc,rounds){
  var b=bestGet(); var k=g+'_'+lv;
  var prev=(b[k]&&typeof b[k].sc==='number')?b[k].sc:-1;
  var better=sc>prev;
  if(better){ b[k]={sc:sc,rounds:rounds,d:new Date().toISOString().slice(0,10)}; bestSet(b); }
  return {better:better, prev:prev};
}
function endRound(){
  addStamp();
  show('p-done');
  var pct=score/ROUNDS;
  $('#dEmoji').textContent=pct>=0.8?'🏆':pct>=0.5?'🎉':'💪';
  $('#dMsg').textContent=pct>=0.8?'와, 정말 대단하세요!':pct>=0.5?'참 잘하셨어요!':'좋아요, 하다 보면 늘어요!';
  var extra='';
  try{
    var rec=recordBest(curGame,level,score,ROUNDS);
    if(rec.better&&rec.prev>=0) extra=' · 🥇 최고 기록 경신!';
    else if(rec.better) extra=' · 첫 기록으로 저장!';
    else if(rec.prev>=0) extra=' · 지금까지 최고 '+rec.prev+'점';
  }catch(e){}
  /* 적응형 난이도 — 잘하면 올리고, 많이 틀리면 내린다 */
  if(pct<0.4 && level>1){
    level=level-1;
    document.querySelectorAll('.lvl').forEach(function(x){x.classList.toggle('sel',parseInt(x.dataset.l,10)===level);});
    $('#dMsg').textContent=$('#dMsg').textContent+' 다음 판은 조금 쉬워져요.';
  }
  else if(pct>=1&&level<3){
    level=level+1;
    document.querySelectorAll('.lvl').forEach(function(x){x.classList.toggle('sel',parseInt(x.dataset.l,10)===level);});
    $('#dMsg').textContent=$('#dMsg').textContent+' 다음 판은 한 단계 어려워져요!';
  }
  $('#dScore').textContent='맞힌 개수: '+score+' / '+ROUNDS+extra+' · 칭찬 도장 1개를 드렸어요 💮';
  say($('#dMsg').textContent);
}

function marketQs(){
  var items=[['사과','🍎'],['배','🍐'],['생선','🐟'],['두부','🥡'],['참외','🍈']];
  var qs=[];
  for(var i=0;i<5;i++){
    var it=items[i%items.length];
    var price,pay;
    if(level===1){ price=(i%2? 500:300); pay=1000; }
    else if(level===2){ price=[700,600,800,400,900][i]; pay=1000; }
    else { price=[1300,2700,1800,3600,2200][i]; pay=5000; }
    var ans=pay-price;
    var opts=shuffle([ans, ans+100, Math.max(0,ans-100), ans+500]).map(function(v){return v.toLocaleString()+'원';});
    if(opts.indexOf(ans.toLocaleString()+'원')<0) opts[0]=ans.toLocaleString()+'원';
    qs.push({q:it[1]+' '+it[0]+' 한 개 '+price.toLocaleString()+'원.\n'+pay.toLocaleString()+'원을 내면 거스름돈은?', a:ans.toLocaleString()+'원', c:opts});
  }
  return qs;
}

  var h='<div class="q-text" style="font-size:1.35rem;white-space:pre-line">'+esc(q.q)+'</div><div class="two">';

  host.innerHTML=h;
  say(q.q.replace(/\n/g,' '));
  var answered=false;
  host.querySelectorAll('.choice').forEach(function(b){
    b.addEventListener('click',function(){
      if(answered)return; answered=true;
      var ok=(b.dataset.a===q.a);
      b.classList.add(ok?'good':'bad');
      if(!ok){ host.querySelectorAll('.choice').forEach(function(x){ if(x.dataset.a===q.a)x.classList.add('good'); }); }
      markScore(ok); feed(ok);
      quizIdx++;
      setTimeout(quizDraw,1200);
    });
  });
}
</script>
</body>
</html>

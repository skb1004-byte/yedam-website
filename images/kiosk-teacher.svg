<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="90" cy="130" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="720" cy="900" r="130" fill="#ffffff" opacity="0.08"/>

  <!-- 열린 책 + 졸업모 아이콘 -->
  <g transform="translate(400,420)">
    <path d="M -190,-40 C -120,-80 -40,-70 0,-30 L 0,140 C -40,100 -120,90 -190,130 Z"
          fill="#ffffff" fill-opacity="0.95"/>
    <path d="M 190,-40 C 120,-80 40,-70 0,-30 L 0,140 C 40,100 120,90 190,130 Z"
          fill="#ffffff" fill-opacity="0.85"/>
    <line x1="-150" y1="-20" x2="-30" y2="0" stroke="#ea580c" stroke-width="4" stroke-opacity="0.35"/>
    <line x1="-150" y1="20" x2="-30" y2="40" stroke="#ea580c" stroke-width="4" stroke-opacity="0.35"/>
    <line x1="-150" y1="60" x2="-30" y2="80" stroke="#ea580c" stroke-width="4" stroke-opacity="0.35"/>
    <line x1="150" y1="-20" x2="30" y2="0" stroke="#ea580c" stroke-width="4" stroke-opacity="0.30"/>
    <line x1="150" y1="20" x2="30" y2="40" stroke="#ea580c" stroke-width="4" stroke-opacity="0.30"/>

    <!-- 졸업모 -->
    <g transform="translate(0,-160)">
      <polygon points="0,-35 115,5 0,45 -115,5" fill="#ffffff"/>
      <ellipse cx="0" cy="10" rx="55" ry="18" fill="#ffffff" fill-opacity="0.85"/>
      <line x1="70" y1="12" x2="70" y2="65" stroke="#ffffff" stroke-width="5"/>
      <circle cx="70" cy="72" r="8" fill="#ffffff"/>
    </g>
  </g>

  <text x="400" y="790" text-anchor="middle" font-family="'Pretendard',-apple-system,sans-serif"
        font-size="42" font-weight="800" fill="#ffffff">선생님도우미</text>
  <text x="400" y="836" text-anchor="middle" font-family="'Pretendard',-apple-system,sans-serif"
        font-size="22" fill="#ffffff" fill-opacity="0.78">나이스 입력 · 시간표 · 학사일정 한 곳에서</text>
</svg>
